[package]
name = "vtok-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Node.js bindings for Vtok (native addon)"

[lib]
crate-type = ["cdylib"]

[dependencies]
vtok-api = { path = "../../rust/crates/vtok-api" }
vtok-cli = { path = "../../rust/crates/vtok-cli" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
opt-level = 3
